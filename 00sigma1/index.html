<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시그마(Σ) 20문제 인터랙티브 학습지</title>
<style>
  :root{
    --pink:#ff7fb0; --pink-dark:#d94f88; --pink-light:#fff0f6;
    --text:#2f2430; --muted:#6e5d67; --white:#fff;
    --green:#178a58; --red:#c9334f;
    --shadow:0 12px 30px rgba(112,48,78,.14);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 10% 0%, #ffe0ec 0 13%, transparent 14%),
      radial-gradient(circle at 95% 8%, #ffd6e6 0 11%, transparent 12%),
      linear-gradient(180deg,#fff8fb,#fffdfd);
    line-height:1.65;
  }
  header{
    padding:52px 20px 34px;
    text-align:center;
    background:linear-gradient(135deg,#ffb7d2,#ff86b5);
    color:#431b2d;
    border-bottom:6px solid #fff;
  }
  header h1{margin:0;font-size:clamp(30px,5vw,54px);letter-spacing:-1.5px}
  header p{margin:12px 0 0;font-size:18px;font-weight:700}
  .wrap{width:min(1080px,92%);margin:28px auto 70px}
  .guide,.score-panel{
    background:rgba(255,255,255,.94);
    border:2px solid #ffd0e1;
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:24px;
  }
  .guide h2,.score-panel h2{margin:0 0 10px;color:var(--pink-dark)}
  .progress{height:16px;background:#f7d9e5;border-radius:999px;overflow:hidden;margin-top:14px}
  .progress>div{width:0;height:100%;background:linear-gradient(90deg,#ff77ac,#e34f8a);transition:.35s}
  .section-title{
    margin:38px 0 18px;padding:15px 20px;border-radius:18px;
    background:linear-gradient(90deg,#ff87b5,#ffb7d1);
    color:#42172a;box-shadow:var(--shadow)
  }
  .problem{
    background:var(--white);border:2px solid #ffd4e3;border-radius:22px;
    padding:23px;margin:18px 0;box-shadow:var(--shadow)
  }
  .problem.solved-correct{border-color:#7ed5ae;background:#f5fff9}
  .problem.solved-wrong{border-color:#f1a0b0;background:#fff7f8}
  .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:42px;height:42px;border-radius:50%;
    background:var(--pink);color:#fff;font-weight:900;margin-right:10px
  }
  .level{
    display:inline-block;padding:5px 10px;border-radius:999px;
    font-size:13px;font-weight:800;background:#ffe5ef;color:#a33867
  }
  .formula{
    margin:20px 0;padding:28px 18px;text-align:center;
    font-family:"Times New Roman",serif;
    font-size:clamp(22px,4vw,32px);
    background:var(--pink-light);border-radius:16px;
    border:1px dashed #e981aa;overflow-x:auto;overflow-y:hidden;
    white-space:nowrap;
  }

  /* 시그마 전용 배치 */
  .sum{
    display:inline-grid;
    grid-template-columns:auto auto;
    grid-template-rows:auto auto auto;
    align-items:center;
    column-gap:.18em;
    vertical-align:middle;
    margin:0 .12em;
  }
  .sum .upper{
    grid-column:1;
    grid-row:1;
    justify-self:center;
    align-self:end;
    font-size:.48em;
    line-height:1;
    font-family:"Times New Roman",serif;
    margin-bottom:-.10em;
  }
  .sum .sigma{
    grid-column:1;
    grid-row:2;
    justify-self:center;
    font-size:1.85em;
    line-height:.82;
    font-weight:400;
  }
  .sum .lower{
    grid-column:1;
    grid-row:3;
    justify-self:center;
    align-self:start;
    font-size:.46em;
    line-height:1;
    font-family:"Times New Roman",serif;
    margin-top:-.04em;
  }
  .sum .term{
    grid-column:2;
    grid-row:1 / 4;
    align-self:center;
    font-size:1em;
    padding-left:.08em;
  }
  .nested-sum{display:inline-flex;align-items:center;gap:.10em}

  .answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{
    flex:1;min-width:180px;padding:13px 15px;border:2px solid #e7bdcf;
    border-radius:12px;font-size:17px;outline:none;background:#fff
  }
  input[type=text]:focus{border-color:var(--pink-dark);box-shadow:0 0 0 4px #ffe2ed}
  button{
    border:0;border-radius:12px;padding:12px 16px;font-weight:900;
    font-size:15px;cursor:pointer;transition:.18s transform,.18s filter
  }
  button:hover{transform:translateY(-1px);filter:brightness(.98)}
  .check{background:var(--pink-dark);color:#fff}
  .show{background:#f6d5e3;color:#7e3154}
  .reset{background:#51424a;color:#fff}
  .result{min-height:28px;margin-top:12px;font-weight:900}
  .correct{color:var(--green)} .wrong{color:var(--red)}
  .solution{
    display:none;margin-top:15px;padding:16px;background:#fff6fa;
    border-left:6px solid var(--pink-dark);border-radius:12px
  }
  .solution h4{margin:0 0 8px;color:var(--pink-dark)}
  .master-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
  .summary{font-size:20px;font-weight:900;color:#833358;min-height:34px}
  .small{font-size:14px;color:var(--muted)}
  footer{
    text-align:center;padding:26px 15px;background:#4b2738;color:#fff;
    font-weight:900;letter-spacing:1px
  }
  @media(max-width:600px){
    .problem{padding:17px}
    .answer-row{display:block}
    input[type=text],button{width:100%;margin-top:8px}
    .formula{font-size:25px;padding:24px 10px}
  }
</style>
</head>
<body>
<header>
  <h1>Σ 시그마 20문제</h1>
  <p>직접 풀기 → 정답 확인 → 해설 보기 → 전체 채점</p>
</header>

<main class="wrap">
  <section class="guide">
    <h2>학습 방법</h2>
    <ol>
      <li>답을 입력하고 <b>정답 확인</b>을 누릅니다.</li>
      <li>풀이가 막히면 <b>정답·해설 보기</b>를 누릅니다.</li>
      <li>20문제를 모두 풀고 <b>전체 채점</b>으로 점수를 확인합니다.</li>
    </ol>
    <div class="progress"><div id="progressBar"></div></div>
    <p id="progressText" class="small">확인한 문제: 0 / 20</p>
  </section>

  <section class="score-panel">
    <h2>전체 결과</h2>
    <div id="summary" class="summary">아직 채점하지 않았습니다.</div>
    <div class="master-buttons">
      <button class="check" onclick="gradeAll()">전체 채점</button>
      <button class="show" onclick="toggleAllSolutions(true)">모든 해설 보기</button>
      <button class="reset" onclick="resetAll()">처음부터 다시 풀기</button>
    </div>
  </section>

  <h2 class="section-title">1부. 기본 문제 10개</h2>
  <div id="basic"></div>

  <h2 class="section-title">2부. 심화 문제 10개</h2>
  <div id="advanced"></div>
</main>

<footer>-세영코딩연구소- &nbsp;&nbsp;&nbsp; ph.D KIM</footer>

<script>
function S(lower, upper, term){
  return `<span class="sum">
    <span class="upper">${upper}</span>
    <span class="sigma">Σ</span>
    <span class="lower">${lower}</span>
    <span class="term">${term}</span>
  </span>`;
}
function NS(outerLower, outerUpper, innerLower, innerUpper, term){
  return `<span class="nested-sum">
    ${S(outerLower, outerUpper, "")}
    ${S(innerLower, innerUpper, term)}
  </span>`;
}

const problems = [
  {level:"기본", formula:S("i=1","5","i"), answer:"15", solution:"1+2+3+4+5=15"},
  {level:"기본", formula:S("i=1","4","2i"), answer:"20", solution:"2×1+2×2+2×3+2×4=2+4+6+8=20"},
  {level:"기본", formula:S("i=1","5","(i+1)"), answer:"20", solution:"2+3+4+5+6=20"},
  {level:"기본", formula:S("i=1","4","i²"), answer:"30", solution:"1²+2²+3²+4²=1+4+9+16=30"},
  {level:"기본", formula:S("k=3","6","k"), answer:"18", solution:"3+4+5+6=18"},
  {level:"기본", formula:S("n=1","5","(2n-1)"), answer:"25", solution:"1+3+5+7+9=25. 처음 5개의 홀수의 합은 5²=25이다."},
  {level:"기본", formula:S("i=1","4","(3i+1)"), answer:"34", solution:"4+7+10+13=34"},
  {level:"기본", formula:S("i=2","5","i²"), answer:"54", solution:"2²+3²+4²+5²=4+9+16+25=54"},
  {level:"기본", formula:S("i=1","3","(i²+i)"), answer:"20", solution:"(1²+1)+(2²+2)+(3²+3)=2+6+12=20"},
  {level:"기본", formula:S("i=1","6","5"), answer:"30", solution:"상수 5를 6번 더하므로 5×6=30"},
  {level:"심화", formula:S("i=1","10","(2i-1)"), answer:"100", solution:"처음 10개의 홀수의 합이다. 1+3+⋯+19=10²=100"},
  {level:"심화", formula:S("i=1","6","(i²+i)"), answer:"112", solution:"∑i²+∑i=91+21=112"},
  {level:"심화", formula:S("k=3","8","(3k-2)"), answer:"87", solution:"7+10+13+16+19+22=87"},
  {level:"심화", formula:S("i=1","5","(i+2)²"), answer:"135", solution:"3²+4²+5²+6²+7²=9+16+25+36+49=135"},
  {level:"심화", formula:S("i=1","8","(5-i)"), answer:"4", solution:"4+3+2+1+0-1-2-3=4"},
  {level:"심화", formula:S("i=1","5","2ⁱ"), answer:"62", solution:"2+4+8+16+32=62"},
  {level:"심화", formula:S("i=1","5","(i²-2i)"), answer:"25", solution:"(-1)+0+3+8+15=25"},
  {level:"심화", formula:NS("i=1","4","j=1","3","(i+j)"), answer:"54", solution:"i=1일 때 9, i=2일 때 12, i=3일 때 15, i=4일 때 18이므로 54"},
  {level:"심화", formula:S("i=2","6","3i²"), answer:"270", solution:"3(2²+3²+4²+5²+6²)=3×90=270"},
  {level:"심화", formula:NS("i=1","5","j=1","i","j"), answer:"35", solution:"안쪽 합은 1, 3, 6, 10, 15이므로 합은 35"}
];

const checked = new Set();

function problemHTML(p, idx){
  return `
  <article class="problem" id="card${idx}">
    <div><span class="num">${idx+1}</span><span class="level">${p.level}</span></div>
    <div class="formula">${p.formula}</div>
    <div class="answer-row">
      <input type="text" id="ans${idx}" inputmode="numeric" placeholder="정답을 입력하세요"
             onkeydown="if(event.key==='Enter') checkAnswer(${idx})">
      <button class="check" onclick="checkAnswer(${idx})">정답 확인</button>
      <button class="show" onclick="toggleSolution(${idx})">정답·해설 보기</button>
    </div>
    <div class="result" id="result${idx}"></div>
    <div class="solution" id="sol${idx}">
      <h4>정답: ${p.answer}</h4>
      <div>${p.solution}</div>
    </div>
  </article>`;
}

document.getElementById("basic").innerHTML = problems.slice(0,10).map((p,i)=>problemHTML(p,i)).join("");
document.getElementById("advanced").innerHTML = problems.slice(10).map((p,i)=>problemHTML(p,i+10)).join("");

function normalize(v){ return String(v).replace(/\s/g,"").replace(/,/g,""); }

function checkAnswer(i){
  const input=document.getElementById(`ans${i}`);
  const result=document.getElementById(`result${i}`);
  const card=document.getElementById(`card${i}`);
  const user=normalize(input.value);
  checked.add(i);
  card.classList.remove("solved-correct","solved-wrong");

  if(user===""){
    result.innerHTML='<span class="wrong">답을 먼저 입력하세요.</span>';
    card.classList.add("solved-wrong");
  }else if(user===normalize(problems[i].answer)){
    result.innerHTML='<span class="correct">정답입니다! 잘했습니다.</span>';
    card.classList.add("solved-correct");
  }else{
    result.innerHTML='<span class="wrong">다시 생각해 보세요. 해설을 확인해도 좋습니다.</span>';
    card.classList.add("solved-wrong");
  }
  updateProgress();
}

function toggleSolution(i){
  const sol=document.getElementById(`sol${i}`);
  sol.style.display = sol.style.display==="block" ? "none" : "block";
}
function toggleAllSolutions(show){
  problems.forEach((_,i)=>document.getElementById(`sol${i}`).style.display=show?"block":"none");
}
function gradeAll(){
  let correct=0, unanswered=0;
  problems.forEach((p,i)=>{
    const value=normalize(document.getElementById(`ans${i}`).value);
    if(value==="") unanswered++;
    if(value===normalize(p.answer)) correct++;
    checkAnswer(i);
  });
  const score=Math.round(correct/problems.length*100);
  let msg=`${correct}개 정답 / 20문제 · 점수 ${score}점`;
  if(unanswered>0) msg+=` · 미입력 ${unanswered}문제`;
  document.getElementById("summary").textContent=msg;
  window.scrollTo({top:0,behavior:"smooth"});
}
function updateProgress(){
  const count=checked.size;
  document.getElementById("progressBar").style.width=`${count/20*100}%`;
  document.getElementById("progressText").textContent=`확인한 문제: ${count} / 20`;
}
function resetAll(){
  problems.forEach((_,i)=>{
    document.getElementById(`ans${i}`).value="";
    document.getElementById(`result${i}`).innerHTML="";
    document.getElementById(`sol${i}`).style.display="none";
    document.getElementById(`card${i}`).classList.remove("solved-correct","solved-wrong");
  });
  checked.clear();
  document.getElementById("summary").textContent="아직 채점하지 않았습니다.";
  updateProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
