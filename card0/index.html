<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EFF1EA">
<title>이번 달 카드 한도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --paper:#EFF1EA;
    --paper-raised:#F8F9F4;
    --ink:#15181B;
    --ink-soft:#5B6058;
    --line:#D8DBD0;
    --hyundai-1:#141416;
    --hyundai-2:#2B2C30;
    --nh-1:#0E4A2C;
    --nh-2:#1F7A4D;
    --amber:#B9762A;
    --amber-bg:#F4E6D3;
    --red:#B8402A;
    --red-bg:#F5DCD4;
    --safe-bg:#DEE8D9;
    --safe-ink:#356B3E;
    --radius:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:56px;
  }
  .mono{font-family:"JetBrains Mono",monospace;}

  .shell{
    max-width:520px;
    margin:0 auto;
    padding:22px 18px 0;
  }

  /* ---- Header / month switcher ---- */
  .month-bar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:2px 2px 18px;
  }
  .month-bar .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    color:var(--ink-soft);
    text-transform:uppercase;
    font-weight:600;
  }
  .month-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:2px;
  }
  .month-title h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
  }
  .month-nav{display:flex;gap:6px;}
  .month-nav button{
    width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, background .15s ease;
  }
  .month-nav button:active{transform:scale(.92);}
  .today-pill{
    font-size:11px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:6px 10px;
    border-radius:999px;
    background:var(--paper-raised);
    cursor:pointer;
  }
  .sync-status{
    font-size:9.5px;
    color:var(--safe-ink);
    letter-spacing:.01em;
  }
  .sync-status.loading{color:var(--ink-soft);}
  .sync-status.error{color:var(--red);font-weight:600;}

  /* ---- Card visuals ---- */
  .wallet{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:22px;
  }
  @media (max-width:420px){
    .wallet{grid-template-columns:1fr;}
  }
  .card{
    position:relative;
    border-radius:var(--radius);
    padding:18px 18px 16px;
    color:#fff;
    overflow:hidden;
    min-height:168px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    isolation:isolate;
    box-shadow:0 10px 24px -14px rgba(0,0,0,.45);
  }
  .card.hyundai{background:linear-gradient(150deg,var(--hyundai-2),var(--hyundai-1) 65%);}
  .card.nh{background:linear-gradient(150deg,var(--nh-2),var(--nh-1) 70%);}

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(120px 90px at 88% -10%, rgba(255,255,255,.14), transparent 70%);
    pointer-events:none;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .card-name{font-size:13.5px;font-weight:600;letter-spacing:.01em;opacity:.95;}
  .card-tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-top:2px;}
  .chip{
    width:26px;height:19px;border-radius:4px;
    background:linear-gradient(135deg,#D9C48A,#B8974F);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);
    position:relative;
  }
  .chip::after{
    content:"";position:absolute;inset:3px;
    border:1px solid rgba(0,0,0,.18);border-radius:2px;
  }

  .card-mid{margin-top:6px;}
  .card-amount{font-size:22px;font-weight:700;letter-spacing:-0.01em;line-height:1.1;}
  .card-limit{font-size:11.5px;opacity:.62;margin-top:3px;}

  .gauge-track{
    height:6px;border-radius:999px;
    background:rgba(255,255,255,.16);
    margin-top:12px;overflow:hidden;
  }
  .gauge-fill{
    height:100%;border-radius:999px;
    background:#fff;
    width:0%;
    transition:width .5s cubic-bezier(.22,.9,.3,1), background .3s ease;
  }
  .gauge-fill.over{background:#FF8A6B;}
  .card-status{
    font-size:10.5px;margin-top:8px;opacity:.85;
    display:flex;justify-content:space-between;
  }
  .card-status .pct{font-weight:700;}
  .card.over{box-shadow:0 0 0 2px var(--red) inset, 0 10px 24px -14px rgba(0,0,0,.5);}

  /* ---- Sections ---- */
  section.panel{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 16px 18px;
    margin-bottom:14px;
  }
  .panel h2{
    font-size:13px;
    font-weight:700;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .panel h2 .idx{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:5px;
    padding:1px 5px;
  }

  /* card select pills */
  .card-select{display:flex;gap:8px;margin-bottom:10px;}
  .pill{
    flex:1;
    padding:10px 8px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:all .15s ease;
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .pill.active.hyundai{background:var(--hyundai-1);color:#fff;border-color:var(--hyundai-1);}
  .pill.active.hyundai .dot{background:#fff;}
  .pill.active.nh{background:var(--nh-2);color:#fff;border-color:var(--nh-2);}
  .pill.active.nh .dot{background:#fff;}

  .field-row{display:flex;gap:8px;margin-bottom:8px;}
  .field{flex:1;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10.5px;color:var(--ink-soft);font-weight:600;}
  .field input{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:9px 10px;
    font-size:14px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  .field input.mono{font-family:"JetBrains Mono",monospace;}
  .field input:focus{outline:none;border-color:var(--ink);}

  .submit-btn{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
    transition:transform .12s ease, opacity .12s ease;
  }
  .submit-btn:active{transform:scale(.985);}
  .submit-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* history */
  .day-group{margin-bottom:10px;}
  .day-label{
    font-size:10.5px;color:var(--ink-soft);font-weight:700;
    padding:0 2px 6px;
    letter-spacing:.02em;
  }
  .entry{
    display:flex;align-items:center;gap:10px;
    padding:9px 8px;
    border-radius:10px;
    background:#fff;
    border:1px solid var(--line);
    margin-bottom:6px;
  }
  .entry .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .entry.hyundai .dot{background:var(--hyundai-1);}
  .entry.nh .dot{background:var(--nh-2);}
  .entry .memo{flex:1;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry .memo.empty{color:var(--ink-soft);}
  .entry .amt{font-family:"JetBrains Mono",monospace;font-size:13.5px;font-weight:600;}
  .entry .del{
    border:none;background:transparent;color:var(--ink-soft);
    cursor:pointer;font-size:15px;padding:0 2px;line-height:1;
    opacity:.55;
  }
  .entry .del:hover{opacity:1;color:var(--red);}

  .empty-state{
    text-align:center;
    padding:26px 10px 18px;
    color:var(--ink-soft);
    font-size:12.5px;
    line-height:1.6;
  }
  .empty-state .glyph{font-size:22px;display:block;margin-bottom:6px;}

  /* limits settings */
  .limits-toggle{
    font-size:11px;color:var(--ink-soft);
    text-align:right;cursor:pointer;
    padding:0 2px 10px;
    user-select:none;
  }
  .limits-edit{display:none;gap:8px;margin-bottom:4px;}
  .limits-edit.open{display:flex;}

  footer{
    max-width:520px;margin:6px auto 0;padding:8px 20px 20px;
    font-size:10.5px;color:var(--ink-soft);text-align:center;
    letter-spacing:.03em;
  }
</style>
</head>
<body>

<div class="shell">

  <div class="month-bar">
    <div>
      <div class="eyebrow">Monthly Card Ledger</div>
      <div class="month-title">
        <h1 id="monthTitle">2026년 7월</h1>
        <div class="month-nav">
          <button id="prevMonth" aria-label="이전 달">‹</button>
          <button id="nextMonth" aria-label="다음 달">›</button>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
      <div class="today-pill" id="gotoToday">오늘로</div>
      <div class="sync-status loading" id="syncStatus">동기화 확인 중…</div>
    </div>
  </div>

  <div class="wallet">
    <div class="card hyundai" id="cardHyundai">
      <div class="card-top">
        <div>
          <div class="card-name">현대카드</div>
          <div class="card-tag">Hyundai Card</div>
        </div>
        <div class="chip"></div>
      </div>
      <div class="card-mid">
        <div class="card-amount mono" id="hyundaiSpent">0원</div>
        <div class="card-limit" id="hyundaiLimitLabel">한도 500,000원</div>
        <div class="gauge-track"><div class="gauge-fill" id="hyundaiGauge"></div></div>
        <div class="card-status">
          <span id="hyundaiRemain">남음 500,000원</span>
          <span class="pct mono" id="hyundaiPct">0%</span>
        </div>
      </div>
    </div>

    <div class="card nh" id="cardNh">
      <div class="card-top">
        <div>
          <div class="card-name">농협카드</div>
          <div class="card-tag">NH Card</div>
        </div>
        <div class="chip"></div>
      </div>
      <div class="card-mid">
        <div class="card-amount mono" id="nhSpent">0원</div>
        <div class="card-limit" id="nhLimitLabel">한도 400,000원</div>
        <div class="gauge-track"><div class="gauge-fill" id="nhGauge"></div></div>
        <div class="card-status">
          <span id="nhRemain">남음 400,000원</span>
          <span class="pct mono" id="nhPct">0%</span>
        </div>
      </div>
    </div>
  </div>

  <div class="limits-toggle" id="limitsToggle">한도 수정</div>
  <div class="limits-edit" id="limitsEdit">
    <div class="field"><label>현대카드 한도</label><input type="number" id="limitHyundaiInput" class="mono" step="10000"></div>
    <div class="field"><label>농협카드 한도</label><input type="number" id="limitNhInput" class="mono" step="10000"></div>
  </div>

  <section class="panel" id="githubPanel">
    <h2><span class="idx">⇄</span> GitHub 연결</h2>
    <div id="githubConnected" style="display:none;">
      <div class="empty-state" style="padding:6px 2px 10px;text-align:left;">
        <span id="githubConnectedText">이 브라우저는 GitHub에 연결되어 있어요.</span>
      </div>
      <button class="submit-btn" id="githubDisconnectBtn" style="background:#fff;color:var(--red);border:1.5px solid var(--red-bg);">연결 해제 (토큰 삭제)</button>
    </div>
    <div id="githubDisconnected">
      <div class="field" style="margin-bottom:8px;">
        <label>Personal Access Token</label>
        <input type="password" id="githubTokenInput" placeholder="github_pat_ 로 시작하는 토큰 붙여넣기" autocomplete="off">
      </div>
      <button class="submit-btn" id="githubConnectBtn">이 브라우저에 연결</button>
    </div>
  </section>

  <section class="panel">
    <h2><span class="idx">＋</span> 오늘 지출 입력</h2>
    <div class="card-select">
      <div class="pill hyundai" data-card="hyundai"><span class="dot"></span>현대카드</div>
      <div class="pill nh" data-card="nh"><span class="dot"></span>농협카드</div>
    </div>
    <div class="field-row">
      <div class="field" style="flex:1.1">
        <label>날짜</label>
        <input type="date" id="entryDate">
      </div>
      <div class="field" style="flex:1.4">
        <label>금액 (원)</label>
        <input type="number" id="entryAmount" class="mono" inputmode="numeric" placeholder="12000">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>메모 (선택)</label>
        <input type="text" id="entryMemo" placeholder="점심, 마트, 교통 등" maxlength="40">
      </div>
    </div>
    <button class="submit-btn" id="addBtn">기록하기</button>
  </section>

  <section class="panel">
    <h2><span class="idx">≡</span> 이번 달 내역</h2>
    <div id="historyList"><div class="empty-state">불러오는 중…</div></div>
  </section>

</div>

<footer>같은 저장소의 텍스트 파일에 저장돼요 · GitHub 토큰으로 기기마다 연결하세요</footer>

<script>
// ============================================================
//  이 저장소의 정보로 바꿔주세요 (토큰은 여기에 적지 않습니다 — 아래 3번 참고)
//  1) GITHUB_OWNER : GitHub 아이디
//  2) GITHUB_REPO  : 이 html을 올릴(올린) 저장소 이름
//  3) 토큰(Personal Access Token)은 파일에 저장하지 않아요.
//     앱 안 "GitHub 연결" 패널에서 매 기기마다 한 번씩 입력하면
//     그 브라우저에만 저장되고, 절대 저장소에 커밋되지 않습니다.
//     (토큰을 파일에 직접 적어서 올리면 GitHub가 자동으로 무효화하고,
//      누구나 그 저장소 내용을 읽고 쓸 수 있게 되어 위험해요.)
// ============================================================
const GITHUB_OWNER = "여기에_입력하세요";     // 예: hong-gildong
const GITHUB_REPO  = "여기에_입력하세요";     // 예: card-tracker
const GITHUB_BRANCH = "main";
const DATA_FILE_PATH = "card-data.txt";        // 같은 저장소(폴더)에 만들어질 데이터 파일
// ============================================================
(function(){
  const LOCAL_CACHE_KEY = "cardTracker.v1";
  const TOKEN_KEY = "cardTracker.githubToken";
  const DEFAULT_LIMITS = { hyundai: 500000, nh: 400000 };
  const CARD_LABEL = { hyundai: "현대카드", nh: "농협카드" };

  function freshStore(){
    return { limits: {...DEFAULT_LIMITS}, entries: [] };
  }
  function normalize(data){
    return {
      limits: { ...DEFAULT_LIMITS, ...((data && data.limits) || {}) },
      entries: Array.isArray(data && data.entries) ? data.entries : []
    };
  }

  const isConfigured = ![GITHUB_OWNER, GITHUB_REPO].some(v=>!v || v.includes("여기에"));
  const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE_PATH}`;
  let fileSha = null; // GitHub가 파일 수정 시 요구하는 버전 값

  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; } }
  function setToken(t){ try{ localStorage.setItem(TOKEN_KEY, t); }catch(e){} }
  function clearToken(){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} }

  // UTF-8(한글 포함)을 안전하게 base64로 인코딩/디코딩
  function b64encode(str){
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_,p)=>String.fromCharCode('0x'+p)));
  }
  function b64decode(str){
    return decodeURIComponent(atob(str.replace(/\n/g,'')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  }

  function setSyncStatus(state){
    const el = document.getElementById("syncStatus");
    if(!el) return;
    if(state==="loading"){ el.textContent = "동기화 확인 중…"; el.className = "sync-status loading"; }
    else if(state==="ok"){ el.textContent = "모든 기기와 동기화됨"; el.className = "sync-status"; }
    else if(state==="error"){ el.textContent = "동기화 실패 · 연결을 확인하세요"; el.className = "sync-status error"; }
    else if(state==="local"){ el.textContent = "이 기기에만 저장됨 · GitHub 연결 필요"; el.className = "sync-status error"; }
    else if(state==="notoken"){ el.textContent = "이 기기에만 저장됨 · 아래에서 연결하세요"; el.className = "sync-status error"; }
  }

  // 로컬 캐시: 응답 전에도 즉시 보여주고, 오프라인 대비용으로도 사용
  function readLocalCache(){
    try{
      const raw = localStorage.getItem(LOCAL_CACHE_KEY);
      return raw ? normalize(JSON.parse(raw)) : freshStore();
    }catch(e){ return freshStore(); }
  }
  function writeLocalCache(){
    try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(store)); }catch(e){}
  }

  async function githubGet(){
    const token = getToken();
    const res = await fetch(`${API_URL}?ref=${GITHUB_BRANCH}&t=${Date.now()}`, {
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json"
      }
    });
    if(res.status === 404) return null; // 아직 데이터 파일이 없음(첫 사용)
    if(!res.ok) throw new Error("GitHub 읽기 실패: " + res.status);
    const json = await res.json();
    fileSha = json.sha;
    return normalize(JSON.parse(b64decode(json.content)));
  }

  async function githubPut(retry){
    const token = getToken();
    const body = {
      message: "카드 지출 업데이트 " + new Date().toISOString(),
      content: b64encode(JSON.stringify(store, null, 2)),
      branch: GITHUB_BRANCH
    };
    if(fileSha) body.sha = fileSha;
    const res = await fetch(API_URL, {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if(res.status === 409 && !retry){
      // 다른 기기가 먼저 저장함 → 최신 버전 정보를 받아서 한 번만 재시도
      await githubGet();
      return githubPut(true);
    }
    if(!res.ok) throw new Error("GitHub 저장 실패: " + res.status);
    const json = await res.json();
    fileSha = json.content.sha;
  }

  async function persist(){
    writeLocalCache();
    if(!isConfigured){ setSyncStatus("local"); return; }
    if(!getToken()){ setSyncStatus("notoken"); return; }
    try{
      await githubPut(false);
      setSyncStatus("ok");
    }catch(e){
      console.error("저장 실패", e);
      setSyncStatus("error");
    }
  }

  let store = readLocalCache();
  let selectedCard = "hyundai";
  let viewYear, viewMonth; // 1-indexed month
  let ready = false;

  const todayD = new Date();
  viewYear = todayD.getFullYear();
  viewMonth = todayD.getMonth() + 1;

  const pad2 = n => String(n).padStart(2,"0");
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  };
  const fmtWon = n => n.toLocaleString("ko-KR") + "원";
  const monthKey = (y,m) => `${y}-${pad2(m)}`;

  // ---- elements ----
  const monthTitle = document.getElementById("monthTitle");
  const entryDate = document.getElementById("entryDate");
  const entryAmount = document.getElementById("entryAmount");
  const entryMemo = document.getElementById("entryMemo");
  const addBtn = document.getElementById("addBtn");
  const historyList = document.getElementById("historyList");
  const limitsToggle = document.getElementById("limitsToggle");
  const limitsEdit = document.getElementById("limitsEdit");
  const limitHyundaiInput = document.getElementById("limitHyundaiInput");
  const limitNhInput = document.getElementById("limitNhInput");
  const githubPanel = document.getElementById("githubPanel");
  const githubConnected = document.getElementById("githubConnected");
  const githubDisconnected = document.getElementById("githubDisconnected");
  const githubConnectedText = document.getElementById("githubConnectedText");
  const githubTokenInput = document.getElementById("githubTokenInput");
  const githubConnectBtn = document.getElementById("githubConnectBtn");
  const githubDisconnectBtn = document.getElementById("githubDisconnectBtn");

  function renderGithubPanel(){
    if(!isConfigured){
      githubPanel.style.display = "none";
      return;
    }
    const connected = !!getToken();
    githubConnected.style.display = connected ? "block" : "none";
    githubDisconnected.style.display = connected ? "none" : "block";
    if(connected){
      githubConnectedText.textContent = `${GITHUB_OWNER}/${GITHUB_REPO} 저장소와 연결됨`;
    }
  }
  githubConnectBtn.addEventListener("click", async ()=>{
    const t = githubTokenInput.value.trim();
    if(!t) { githubTokenInput.focus(); return; }
    setToken(t);
    githubTokenInput.value = "";
    renderGithubPanel();
    await refreshFromRemote();
  });
  githubDisconnectBtn.addEventListener("click", ()=>{
    clearToken();
    fileSha = null;
    renderGithubPanel();
    setSyncStatus("notoken");
  });

  document.querySelectorAll(".pill").forEach(p=>{
    p.addEventListener("click", ()=>{
      selectedCard = p.dataset.card;
      document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
      p.classList.add("active");
    });
  });
  document.querySelector('.pill[data-card="hyundai"]').classList.add("active");

  document.getElementById("prevMonth").addEventListener("click", ()=>{
    viewMonth--; if(viewMonth<1){viewMonth=12; viewYear--;}
    render();
  });
  document.getElementById("nextMonth").addEventListener("click", ()=>{
    viewMonth++; if(viewMonth>12){viewMonth=1; viewYear++;}
    render();
  });
  document.getElementById("gotoToday").addEventListener("click", ()=>{
    const d = new Date();
    viewYear = d.getFullYear(); viewMonth = d.getMonth()+1;
    entryDate.value = todayStr();
    render();
  });

  limitsToggle.addEventListener("click", ()=>{
    limitsEdit.classList.toggle("open");
    limitsToggle.textContent = limitsEdit.classList.contains("open") ? "한도 수정 닫기" : "한도 수정";
  });
  [limitHyundaiInput, limitNhInput].forEach(inp=>{
    inp.addEventListener("change", async ()=>{
      const h = parseInt(limitHyundaiInput.value,10);
      const n = parseInt(limitNhInput.value,10);
      store.limits.hyundai = isNaN(h) || h<=0 ? DEFAULT_LIMITS.hyundai : h;
      store.limits.nh = isNaN(n) || n<=0 ? DEFAULT_LIMITS.nh : n;
      render();
      await persist();
    });
  });

  entryDate.value = todayStr();

  addBtn.addEventListener("click", async ()=>{
    if(!ready) return;
    const date = entryDate.value;
    const amount = parseInt(entryAmount.value, 10);
    const memo = entryMemo.value.trim();

    if(!date){ entryDate.focus(); return; }
    if(!amount || amount<=0){ entryAmount.focus(); return; }

    addBtn.disabled = true;
    addBtn.textContent = "저장 중…";

    store.entries.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
      date, card: selectedCard, amount, memo
    });

    // jump view to the month of the entry just added
    const [y,m] = date.split("-").map(Number);
    viewYear = y; viewMonth = m;

    entryAmount.value = "";
    entryMemo.value = "";
    render();

    await persist();
    addBtn.disabled = false;
    addBtn.textContent = "기록하기";
  });

  async function deleteEntry(id){
    store.entries = store.entries.filter(e=>e.id!==id);
    render();
    await persist();
  }

  function monthEntries(){
    const mk = monthKey(viewYear, viewMonth);
    return store.entries.filter(e=>e.date.startsWith(mk));
  }

  function updateCard(cardKey, spent, limit){
    const prefix = cardKey === "hyundai" ? "hyundai" : "nh";
    const pct = limit>0 ? Math.round((spent/limit)*100) : 0;
    const cappedWidth = Math.min(pct,100);
    const remain = limit - spent;

    document.getElementById(prefix+"Spent").textContent = fmtWon(spent);
    document.getElementById(prefix+"LimitLabel").textContent = "한도 " + fmtWon(limit);
    document.getElementById(prefix+"Pct").textContent = pct + "%";
    document.getElementById(prefix+"Remain").textContent = remain>=0
      ? "남음 " + fmtWon(remain)
      : "초과 " + fmtWon(Math.abs(remain));

    const gauge = document.getElementById(prefix+"Gauge");
    gauge.style.width = cappedWidth + "%";
    gauge.classList.toggle("over", spent>limit);

    const cardEl = document.getElementById(prefix==="hyundai" ? "cardHyundai" : "cardNh");
    cardEl.classList.toggle("over", spent>limit);
  }

  function render(){
    monthTitle.textContent = `${viewYear}년 ${viewMonth}월`;

    const entries = monthEntries();
    const hyundaiSpent = entries.filter(e=>e.card==="hyundai").reduce((s,e)=>s+e.amount,0);
    const nhSpent = entries.filter(e=>e.card==="nh").reduce((s,e)=>s+e.amount,0);

    updateCard("hyundai", hyundaiSpent, store.limits.hyundai);
    updateCard("nh", nhSpent, store.limits.nh);

    // group by date desc
    const byDate = {};
    entries.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
    const dates = Object.keys(byDate).sort((a,b)=> b.localeCompare(a));

    if(dates.length===0){
      historyList.innerHTML = `<div class="empty-state"><span class="glyph">＋</span>이번 달 기록이 아직 없어요<br>위에서 첫 지출을 입력해보세요</div>`;
      return;
    }

    historyList.innerHTML = dates.map(date=>{
      const list = byDate[date].slice().sort((a,b)=> b.id.localeCompare(a.id));
      const d = new Date(date+"T00:00:00");
      const label = `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
      const rows = list.map(e=>`
        <div class="entry ${e.card}">
          <span class="dot"></span>
          <span class="memo ${e.memo?"":"empty"}">${e.memo ? escapeHtml(e.memo) : CARD_LABEL[e.card]}</span>
          <span class="amt">${fmtWon(e.amount)}</span>
          <button class="del" data-id="${e.id}" aria-label="삭제">✕</button>
        </div>`).join("");
      return `<div class="day-group"><div class="day-label">${label}</div>${rows}</div>`;
    }).join("");

    historyList.querySelectorAll(".del").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteEntry(btn.dataset.id));
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function applyRemote(data){
    if(data) store = normalize(data);
    writeLocalCache();
    limitHyundaiInput.value = store.limits.hyundai;
    limitNhInput.value = store.limits.nh;
    ready = true;
    render();
  }

  async function refreshFromRemote(){
    if(!isConfigured || !getToken()){
      applyRemote(null);
      setSyncStatus(!isConfigured ? "local" : "notoken");
      return;
    }
    setSyncStatus("loading");
    try{
      const data = await githubGet();
      applyRemote(data);
      setSyncStatus("ok");
    }catch(e){
      console.error("불러오기 실패", e);
      applyRemote(null); // 로컬 캐시라도 보여줌
      setSyncStatus("error");
    }
  }

  function init(){
    limitHyundaiInput.value = store.limits.hyundai;
    limitNhInput.value = store.limits.nh;
    renderGithubPanel();
    ready = true;
    render();
    refreshFromRemote();
  }

  // 다른 기기(예: 스마트폰)에서 방금 저장한 내용을 놓치지 않도록,
  // 이 창으로 돌아올 때마다 최신 데이터를 다시 받아옵니다.
  let resyncing = false;
  async function resync(){
    if(!ready || resyncing || !isConfigured || !getToken()) return;
    resyncing = true;
    await refreshFromRemote();
    resyncing = false;
  }
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") resync();
  });
  window.addEventListener("focus", resync);

  init();
})();
</script>
</body>
</html>
